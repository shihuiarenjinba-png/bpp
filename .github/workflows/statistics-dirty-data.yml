name: Statistics dirty-data checks

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: |
          python -m py_compile             new-skills/securities-analysis/skills/portfolio-analytics/scripts/portfolio_analyzer.py             new-skills/ff5-macro-analysis/scripts/02_granger_analysis.py             new-skills/nonlinear-granger-analysis/scripts/02_threshold_granger.py             new-skills/nonlinear-granger-analysis/scripts/03_kernel_granger.py
